name: Continuous Delivery - Publish SDK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # A-04: CI gate — publish only runs if build and tests pass on the tagged commit.
  build-and-test:
    name: Build & Test Before Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tests
        run: mvn clean verify -DskipTests=false

  publish:
    name: Publish Maven Artifact to GitHub Packages
    runs-on: ubuntu-latest
    # A-04: deploy only proceeds when build-and-test succeeds.
    needs: [ build-and-test ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # A-03: strip leading 'v' from tag (e.g. v1.2.0 -> 1.2.0) and set pom.xml version
      #       so the published artifact version always matches the Git tag.
      - name: Sync pom.xml Version with Git Tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Setting Maven version to: $VERSION"
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Publish Package
        run: mvn clean deploy -s ${{ github.workspace }}/settings.xml -DskipTests=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Auto-Generate Notes
        run: |
          gh release create ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
